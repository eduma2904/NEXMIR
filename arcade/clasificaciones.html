const scales=[
 {id:'apgar',name:'Apgar',icon:'♥',topic:'Pediatría',type:'score',origin:'ambos',note:'Puntúa los cinco criterios (0–2) de cada recién nacido.',source:'https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2015/10/the-apgar-score',labels:['Frecuencia cardíaca','Respiración','Tono muscular','Respuesta al estímulo','Coloración'],rules:['0 ausente; 1 <100 lpm; 2 ≥100 lpm.','0 apnea; 1 lenta o irregular; 2 llanto vigoroso.','0 flácido; 1 flexión; 2 movimientos activos.','0 sin respuesta; 1 mueca; 2 tos, estornudo o retirada vigorosa.','0 pálido/azul; 1 tronco rosado y extremidades azules; 2 totalmente rosado.'],values:[0,1,2],cases:[
  {text:'Al primer minuto de vida',observations:['110 lpm','respiración lenta e irregular','ligera flexión','tose ante el estímulo','tronco rosado con manos y pies azulados'],answer:[2,1,1,2,1]},
  {text:'A los cinco minutos',observations:['80 lpm','sin respiración','flácido','mueca al estímulo','palidez generalizada'],answer:[1,0,0,1,0]},

  {text:'A los cinco minutos',observations:['95 lpm','llanto vigoroso','flexión discreta','mueca al estímulo','tronco rosado con extremidades azuladas'],answer:[1,2,1,1,1]},
  {text:'Al primer minuto de vida',observations:['120 lpm','sin respiración','movimiento activo de extremidades','no reacciona al estímulo','piel completamente rosada'],answer:[2,0,2,0,2]}
 ]},
 {id:'hinchey',name:'Hinchey original',icon:'✣',topic:'Cirugía',type:'choice',origin:'usuario',note:'Relaciona hallazgos de diverticulitis con grados I–IV.',source:'https://pmc.ncbi.nlm.nih.gov/articles/PMC3031281/',options:['I','II','III','IV'],cases:[
  {text:'Absceso pegado al segmento de colon con diverticulitis, sin colección distante.',answer:'I',why:'Absceso pericólico localizado.'},{text:'Absceso pericólico delimitado, sin peritonitis generalizada.',answer:'I',why:'Colección localizada junto al colon.'},
  {text:'Colección pélvica separada del segmento diverticular inflamado.',answer:'II',why:'Absceso pélvico distante.'},{text:'Absceso intraabdominal alejado del colon afectado.',answer:'II',why:'Absceso intraabdominal distante.'},
  {text:'Pus libre y difuso en la cavidad, sin material fecal libre.',answer:'III',why:'Peritonitis purulenta generalizada.'},{text:'Peritonitis purulenta difusa sin contaminación fecaloidea.',answer:'III',why:'El contenido difuso es purulento.'},

 ]},
 {id:'asma',name:'Gravedad del asma',icon:'≈',topic:'Neumología',type:'choice',origin:'ambos',note:'Tabla histórica aportada: intermitente y persistente leve, moderada o severa.',caution:'Tabla histórica de estudio. GINA 2026 valora la gravedad retrospectivamente según el tratamiento necesario.',source:'https://ginasthma.org/wp-content/uploads/2026/05/GINA-2026-Strategy-Report-WMS.pdf',options:['Intermitente','Persistente leve','Persistente moderada','Persistente severa'],cases:[
  {text:'Síntomas 1 día por semana, una noche al mes; VEF1 92 %, variabilidad del PEF 15 %, episodios breves.',answer:'Intermitente',why:'Todos los datos pertenecen a la columna intermitente.'},
  {text:'Síntomas 4 días por semana, 3 noches al mes; VEF1 88 %, variabilidad 25 %; limitación ocasional del ejercicio.',answer:'Persistente leve',why:'Más de dos días por semana sin síntomas diarios, 3 noches al mes y variabilidad 20–30 %.'},
  {text:'Síntomas diarios, despertares 2 noches por semana; VEF1 70 %, variabilidad 35 %; limita actividad y sueño.',answer:'Persistente moderada',why:'Síntomas diarios y VEF1 de 60–80 %. La variabilidad >30 % no distingue moderada de severa en la tabla aportada.'},

  {text:'Síntomas diurnos solo una vez por semana, pero despierta 2 noches por semana; VEF1 85 %, variabilidad 16 %.',answer:'Persistente moderada',why:'El dato nocturno de más de una vez por semana determina la categoría en la tabla propuesta.'}
 ]},
 {id:'curb',name:'CURB-65',icon:'＋',topic:'Neumología',type:'score',origin:'usuario',note:'Decide si cada parámetro aporta 0 o 1 punto en neumonía adquirida en la comunidad.',source:'https://www.nice.org.uk/guidance/NG250/chapter/recommendations',labels:['Estado mental','Urea','Frecuencia respiratoria','Presión arterial','Edad'],rules:['Un punto por desorientación/confusión nueva.','Un punto solo si la urea supera 7 mmol/L.','Un punto con 30 respiraciones/min o más.','Un punto si sistólica <90 o diastólica ≤60 mmHg; nunca dos.','Un punto desde los 65 años, inclusive.'],values:[0,1],cases:[
  {text:'Neumonía: 38 años, orientado, urea 5,5 mmol/L, FR 22/min, PA 120/75 mmHg.',observations:['orientado','5,5 mmol/L','22/min','120/75 mmHg','38 años'],answer:[0,0,0,0,0]},
  {text:'Neumonía: 65 años, orientado, urea 7,0 mmol/L, FR 29/min, PA 110/70 mmHg.',observations:['orientado','7,0 mmol/L','29/min','110/70 mmHg','65 años'],answer:[0,0,0,0,1],why:'Urea igual a 7 no cumple el umbral >7.'},
  {text:'Neumonía: 52 años, desorientación nueva, urea 8,2 mmol/L, FR 26/min, PA 125/78 mmHg.',observations:['desorientación nueva','8,2 mmol/L','26/min','125/78 mmHg','52 años'],answer:[1,1,0,0,0]},
  {text:'Neumonía: 70 años, orientado, urea 9,1 mmol/L, FR 32/min, PA 118/72 mmHg.',observations:['orientado','9,1 mmol/L','32/min','118/72 mmHg','70 años'],answer:[0,1,1,0,1]},
  {text:'Neumonía: 68 años, confusión nueva, urea 9,0 mmol/L, FR 34/min, PA 88/58 mmHg.',observations:['confusión nueva','9,0 mmol/L','34/min','88/58 mmHg','68 años'],answer:[1,1,1,1,1],why:'La presión arterial aporta un solo punto aunque ambas cifras sean bajas.'}
 ]},
 {id:'forrest',name:'Forrest',icon:'◉',topic:'Digestivo',type:'choice',origin:'ambos',note:'Identifica el estigma endoscópico y consulta la conducta.',source:'https://www.esge.com/endoscopic-diagnosis-and-management-of-nonvariceal-upper-gastrointestinal-hemorrhage-esge-update-2021',options:['Ia','Ib','IIa','IIb','IIc','III'],cases:[
  {text:'Úlcera péptica con sangrado activo en chorro.',answer:'Ia',why:'Sangrado arterial en chorro. Se indica hemostasia endoscópica.'},
  {text:'Úlcera péptica con sangrado activo rezumante continuo.',answer:'Ib',why:'Sangrado en sábana o rezumante. Se indica hemostasia endoscópica.'},

  {text:'Coágulo firmemente adherido al lecho de una úlcera, sin sangrado visible alrededor.',answer:'IIb',why:'Coágulo adherido. Considerar retirada; tratar si se descubre sangrado activo o un vaso visible.'},

  {text:'Úlcera de base limpia, sin sangrado ni estigmas de hemorragia reciente.',answer:'III',why:'Base limpia. No se recomienda hemostasia endoscópica de esa lesión.'}
 ]},
 {id:'glasgow',name:'Glasgow (GCS)',icon:'✦',topic:'Neurología',type:'score',origin:'ambos',note:'Asigna E, V y M antes de sumar. Incluye un caso no evaluable.',source:'https://www.glasgowcomascale.org/gcs-aid/',labels:['Apertura ocular (E)','Respuesta verbal (V)','Respuesta motora (M)'],rules:['E4 espontánea, E3 a la voz, E2 a la presión, E1 ninguna.','V5 orientada, V4 confusa, V3 palabras, V2 sonidos, V1 ninguna; NT si no evaluable.','M6 obedece, M5 localiza, M4 flexión normal, M3 anormal, M2 extensión, M1 ninguna.'],values:[[1,2,3,4],[1,2,3,4,5,'NT'],[1,2,3,4,5,6]],cases:[

 ]},
 {id:'garden',name:'Garden',icon:'⌁',topic:'Traumatología',type:'choice',origin:'usuario',note:'Fracturas subcapitales: completa/incompleta y grado de desplazamiento.',source:'https://pmc.ncbi.nlm.nih.gov/articles/PMC6259691/',options:['I','II','III','IV'],cases:[

 asma:{headers:['Característica','Intermitente','Persistente leve','Persistente moderada','Persistente severa'],rows:[['Síntomas diurnos','≤2/semana','>2/semana, no diarios','Diarios','Continuos todo el día'],['Síntomas nocturnos','≤2/mes','3–4/mes','>1/semana','Frecuentes, casi todas las noches'],['VEF1 o PEF','≥80 %','≥80 %','60–80 %','<60 %'],['Variabilidad del PEF','<20 %','20–30 %','>30 %','>30 %'],['Exacerbaciones','Breves','Pueden afectar actividad','Afectan actividad y sueño','Frecuentes y graves']],note:'Tabla histórica aportada para el ejercicio. Si distintos rasgos caen en categorías diferentes, se usa el de mayor gravedad. GINA actual define la gravedad retrospectivamente según el tratamiento requerido.'},

 killip:{headers:['Clase','Hallazgo tras infarto'],rows:[['I','Sin signos clínicos de insuficiencia cardíaca'],['II','Crepitantes hasta la mitad de los campos pulmonares, tercer ruido (S3) y/o ingurgitación yugular'],['III','Edema agudo de pulmón franco; crepitantes extensos'],['IV','Shock cardiogénico: hipotensión sostenida con hipoperfusión']],note:'Se asigna la clase más grave presente. En un IAM con shock cardiogénico corresponde Killip IV, incluso si los pulmones están limpios.'}
};
function reviewContent(id){const d=reviewData[id];return `<div class="table-wrap"><table class="recap"><thead><tr>${d.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${d.note?`<p class="recap-note">${esc(d.note)}</p>`:''}`}
function renderScore(){
 const s=state.scale,c=state.deck[state.index];
 const body=`<div class="case"><strong>${esc(c.text)}${c.text.endsWith('.')?'':':'}</strong>${s.id==='apgar'?` ${c.observations.map(esc).join('; ')}.`:''}</div><div class="rows">${s.labels.map((label,i)=>{const vals=Array.isArray(s.values[0])?s.values[i]:s.values;return `<div class="row" data-row="${i}"><div><b>${esc(label)}</b><small>${esc(c.observations[i])}</small></div><div class="points" role="group" aria-label="Valor para ${esc(label)}">${vals.map(v=>`<button type="button" data-index="${i}" data-value="${v}" aria-label="${v} para ${esc(label)}" aria-pressed="false">${v}</button>`).join('')}</div></div>`}).join('')}</div>`;
 frame(body);
 root.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{if(state.locked)return;state.answers[b.dataset.index]=b.dataset.value==='NT'?'NT':Number(b.dataset.value);root.querySelectorAll(`[data-index="${b.dataset.index}"]`).forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
 root.querySelector('#submit').onclick=()=>{
  if(Object.keys(state.answers).length!==s.labels.length)return notice('Responde todos los componentes antes de comprobar.');
  state.locked=true;let hits=0;const wrong=[],review=[];
  s.labels.forEach((label,i)=>{const ok=state.answers[i]===c.answer[i];if(ok)hits++;else{wrong.push(`<li>${esc(label)}: ${esc(c.answer[i])} (${esc(c.observations[i])}). ${esc(s.rules?.[i]||'')}</li>`);review.push(`${label} = ${c.answer[i]}`)}root.querySelector(`[data-row="${i}"]`).classList.add(ok?'ok':'no')});
  root.querySelectorAll('[data-value]').forEach(b=>b.disabled=true);
  const earned=reward(hits,s.labels.length,`${s.name}: ${review.join('; ')}`);
  feedback(`<strong>+${earned} puntos · ${hits}/${s.labels.length} componentes · ${scoreCategory(s,c.answer)}.</strong>${c.why?`<p>${esc(c.why)}</p>`:''}${wrong.length?`<ul>${wrong.join('')}</ul>`:'<p>Todos los valores coinciden con el caso.</p>'}`,hits===s.labels.length)
 }
}
function renderChoice(){const s=state.scale,c=state.deck[state.index];frame(`<div class="case"><strong>Caso:</strong> ${esc(c.text)}</div><div class="choices" role="group" aria-label="Elige la clasificación">${s.options.map(v=>`<button class="pick" type="button" data-option="${esc(v)}" aria-pressed="false"><span class="symbol">${esc(v)}</span><span>${esc(s.name)} ${esc(v)}</span></button>`).join('')}</div>`);root.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(state.locked)return;state.choice=b.dataset.option;root.querySelectorAll('[data-option]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});root.querySelector('#submit').onclick=()=>{if(!state.choice)return notice('Elige una opción antes de comprobar.');state.locked=true;const ok=state.choice===c.answer;root.querySelectorAll('[data-option]').forEach(b=>{b.disabled=true;if(b.dataset.option===c.answer)b.classList.add('ok');else if(b.dataset.option===state.choice)b.classList.add('no')});const earned=reward(Number(ok),1,`${s.name}: ${c.answer} — ${c.why}`);feedback(`<strong>+${earned} puntos · ${esc(s.name)} ${esc(c.answer)}.</strong><p>${esc(c.why)}</p>`,ok)}}
function render(){state.scale.type==='score'?renderScore():renderChoice()}
function summary(early=false){const s=state.scale,total=state.deck.length,answered=early?state.index+(state.locked?1:0):total;mount(`<section class="board"><div class="eyebrow">${early?'Partida terminada':'Práctica completada'} · ${esc(s.name)}</div><h1>${state.perfect===total&&!early?'¡Todos los casos perfectos!':'Ya sabes qué repasar'}</h1><p class="lead">Respondiste ${answered} de ${total} casos. Cada caso se comprueba una sola vez; puedes repetir con el orden mezclado.</p><div class="summary-num">${state.points} pts</div><div class="summary-grid"><div><b>${state.perfect}/${answered}</b><small>Casos perfectos</small></div><div><b>${state.hearts}/3</b><small>Escudos restantes</small></div><div><b>${state.errors.length}</b><small>Casos para repasar</small></div></div><h3>Repaso de errores</h3><div class="review">${state.errors.length?state.errors.map(e=>`<div>${esc(e)}</div>`).join(''):'<div>No hubo errores en esta ronda.</div>'}</div><h2>Repasa la clasificación completa</h2><p class="muted">Al terminar la partida, puedes revisar todos los criterios y valores.</p>${reviewContent(s.id)}<div class="footer"><button class="secondary" id="home" type="button">Elegir otra tabla</button><button class="primary" id="again" type="button">Practicar otra vez</button></div><p class="reference">Casos originales para estudio MIR. <a href="${esc(s.source)}" target="_blank" rel="noopener">Fuente de referencia de ${esc(s.name)}</a>. ${s.caution?esc(s.caution):''} El juego no sustituye la valoración clínica individual.</p></section>`);document.getElementById('reportGame').hidden=true;root.querySelector('#home').onclick=home;root.querySelector('#again').onclick=()=>start(s.id)}
const bundledScales=scales.map(s=>structuredClone(s));
const bundledReviews=structuredClone(reviewData);
const string=(value,max=3000)=>typeof value==='string'&&value.trim().length>0&&value.length<=max;
function validReview(r){
 return r&&Array.isArray(r.headers)&&r.headers.length>=2&&r.headers.length<=8&&r.headers.every(v=>string(v,120))
  &&Array.isArray(r.rows)&&r.rows.length>=1&&r.rows.length<=40
  &&r.rows.every(row=>Array.isArray(row)&&row.length===r.headers.length&&row.every(v=>string(v,400)))
  &&(!r.note||string(r.note,1000));
}
function validCase(c,s){
 if(!c||!string(c.text,1200))return false;
 if(s.type==='choice')return typeof c.answer==='string'&&s.options.includes(c.answer)&&string(c.why,1000);
 return Array.isArray(c.observations)&&c.observations.length===s.labels.length
  &&c.observations.every(v=>string(v,300))&&Array.isArray(c.answer)&&c.answer.length===s.labels.length
  &&c.answer.every((v,i)=>(Array.isArray(s.values[0])?s.values[i]:s.values).includes(v));
}
function applyDefinitions(rows){
 scales.splice(0,scales.length,...bundledScales.map(s=>structuredClone(s)));
 for(const key of Object.keys(reviewData))delete reviewData[key];
 Object.assign(reviewData,structuredClone(bundledReviews));
 for(const entry of rows||[]){
  const d=entry?.data,base=scales.find(s=>s.id===entry?.id);
  if(!d||!Array.isArray(d.cases)||d.cases.length<1||d.cases.length>100)continue;
  if(base){
   if(!d.cases.every(c=>validCase(c,base))||d.review&&!validReview(d.review))continue;
   base.cases.push(...d.cases);if(d.review)reviewData[base.id]=d.review;
  }else{
   if(!/^[a-z][a-z0-9_-]{2,39}$/.test(entry.id||'')||!string(d.name,120)||!string(d.topic,120)
     ||!string(d.note,500)||!['score','choice'].includes(d.type)||!validReview(d.review)
     ||!string(d.source,500)||!/^https:\/\//.test(d.source)
     ||d.type==='choice'&&(!Array.isArray(d.options)||d.options.length<2||d.options.length>12||!d.options.every(v=>string(v,50)))
     ||d.type==='score'&&(!Array.isArray(d.labels)||d.labels.length<2||d.labels.length>8||!d.labels.every(v=>string(v,120))
       ||!Array.isArray(d.values)||!d.values.length||d.values.length>8
       ||Array.isArray(d.values[0])&&(d.values.length!==d.labels.length||!d.values.every(Array.isArray))
       ||!d.values.every(v=>Array.isArray(v)?v.length>0&&v.every(n=>Number.isInteger(n)||n==='NT'):Number.isInteger(v)||v==='NT'))
     ||!d.cases.every(c=>validCase(c,d)))continue;
   const newScale={...d,id:entry.id,icon:string(d.icon,3)?d.icon:'✦',origin:'admin'};
   scales.push(newScale);reviewData[entry.id]=d.review;
  }
 }
 if(!state.scale)home();
}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==window.parent)return;
 const data=event.data||{};
 if(data.type==='nexmir:arcade-theme'){
  document.documentElement.dataset.palette=['blue','green','orange','pink'].includes(data.palette)?data.palette:'blue';
  document.documentElement.dataset.themeMode=data.mode==='light'?'light':'dark';
 }
 if(data.type==='nexmir:arcade-classifications-init')applyDefinitions(data.definitions);
});
bindTap(document.getElementById('leaveGame'),()=>transition('Saliendo del juego…',()=>parentAction('exit')));
bindTap(document.getElementById('suggestGame'),()=>transition('Abriendo sugerencias…',()=>parentAction('suggest')));
bindTap(document.getElementById('reportGame'),()=>{
 const s=state.scale,c=state.deck[state.index];if(!s||!c)return;
 const number=s.cases.indexOf(c);if(number<0)return;
 parentAction('classification-report',{sourceId:'classification:'+s.id+':'+number,title:s.name,prompt:c.text});
});
home();
window.parent.postMessage({type:'nexmir:arcade-ready'},location.origin);
})();
</script></body></html>
