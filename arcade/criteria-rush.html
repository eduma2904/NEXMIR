<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXMIR · Criteria Rush</title>
<meta name="theme-color" content="#081525"><link rel="stylesheet" href="arcade-theme.css?v=5.1.50"><script src="arcade-theme.js?v=5.1.50"></script>
<style>
:root{--a:var(--accent);--b:var(--accent-text);--ink:var(--text)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 86% 2%,var(--glow),transparent 27%),var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
button,select{font:inherit}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:auto;padding:22px;min-height:100vh;padding-bottom:max(22px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{display:grid;place-items:center;width:39px;height:39px;border-radius:12px;background:var(--accent-fill);color:var(--on-accent);font-weight:900}
.brand small,.muted{color:var(--muted)}.brand small{display:block}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);padding:9px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.btn.primary{border:1px solid transparent;background:var(--accent-fill);color:var(--on-accent);font-weight:850}
.btn.primary:hover:not(:disabled){background:var(--accent-fill-hover);border-color:transparent}
select.btn{background:var(--card);color:var(--ink)}
.hero,.board,.card{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);box-shadow:0 16px 45px color-mix(in srgb,#000 14%,transparent)}
.hero{padding:27px;margin:24px 0 18px}
.eyebrow{color:var(--accent-text);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.hero h1{margin:5px 0;font-size:clamp(25px,4vw,40px);line-height:1.1}
.deck{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.module{color:inherit;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:15px;cursor:pointer}
.module:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.module .ico{font-size:23px}.module b,.module span{display:block}.module b{margin:8px 0 2px}.module small{color:var(--muted)}
.board{max-width:760px;margin:24px auto;padding:clamp(18px,4vw,32px)}
.hud{display:flex;justify-content:space-between;gap:8px;margin-bottom:16px}
.stat{min-width:80px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;text-align:center;background:var(--card)}
.stat small,.stat b{display:block}.stat small{font-size:10px;color:var(--muted);text-transform:uppercase}
.progress{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:15px 0}
.progress i{display:block;height:100%;background:var(--accent);transition:.25s}
.fact{font-size:clamp(24px,4.5vw,42px);font-weight:850;line-height:1.12;text-align:center;margin:42px auto;max-width:650px}
.question{text-align:center;color:var(--muted)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:20px}
.choice{font-size:16px;font-weight:800;padding:17px}
.choice.accept{border-color:var(--good)}.choice.reject{border-color:var(--bad)}
.choice.accept:hover:not(:disabled){background:color-mix(in srgb,var(--good) 14%,var(--card));border-color:var(--good)}
.choice.reject:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 12%,var(--card));border-color:var(--bad)}
.feedback{min-height:25px;text-align:center;margin:16px 0 0;font-weight:700}
.ok{color:var(--good-text)}.no{color:var(--bad-text)}
.result{text-align:center}
.ring{--p:0;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;margin:5px auto 18px;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;z-index:1;font-size:29px}
.result-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.review{display:grid;gap:6px;text-align:left;margin:16px 0}
.review-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.review-row small{color:var(--muted)}.review-row b:first-child{font-size:18px}
.score-note .muted,.score-note small{color:var(--text)}
.score-note{border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:13px;padding:12px;margin:15px 0}
.game-actions{display:flex;justify-content:space-between;gap:9px;align-items:center}.game-actions .btn{font-size:13px}
.loader{padding:55px 20px;text-align:center;color:var(--muted)}
@media(max-width:760px){.wrap{padding:13px}.deck{grid-template-columns:1fr 1fr}.hero{padding:20px}.board{margin-top:14px}.top{align-items:flex-start}.brand small{display:none}}
@media(max-width:430px){.deck{grid-template-columns:1fr}.choices{gap:8px}.choice{padding:14px 8px;font-size:14px}.fact{margin:34px auto}.game-actions{align-items:stretch;flex-direction:column}.game-actions .btn{width:100%}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="mark">N</div><div><b>CRITERIA RUSH</b><small>Arcade · atrapa los criterios</small></div></div><nav class="nav"><button class="btn" id="exit">← Salir</button><button class="btn" id="suggest">＋ Sugerir</button><button class="btn" id="report" hidden>⚑ Reportar</button></nav></header><div id="app"><div class="loader">Preparando criterios…</div></div></main><script>
const base=[
{id:'centor',name:'Centor modificado',topic:'ORL',icon:'🫁',note:'Faringitis estreptocócica: atrapa criterios y aprende su valor.',scoring:{range:'−1 a 5',interpretation:'0–1 bajo riesgo · 2–3 intermedio · ≥4 alto riesgo'},items:[['Fiebre >38 °C',1,1],['Ausencia de tos',1,1],['Exudado o inflamación amigdalar',1,1],['Adenopatía cervical anterior dolorosa',1,1],['Edad de 3 a 14 años',1,1],['Edad ≥45 años',1,-1],['Tos productiva',0,0],['Rinorrea intensa',0,0],['Úlceras orales',0,0],['Conjuntivitis bilateral',0,0]]},
{id:'alvarado',name:'Alvarado',topic:'Cirugía General',icon:'🩺',note:'MANTRELS: identifica los hallazgos de apendicitis aguda.',scoring:{range:'0 a 10',interpretation:'1–4 baja probabilidad · 5–6 compatible/observación · 7–10 alta probabilidad'},items:[['Migración del dolor a fosa ilíaca derecha',1,1],['Anorexia',1,1],['Náuseas o vómitos',1,1],['Dolor en fosa ilíaca derecha',1,2],['Rebote o defensa',1,1],['Fiebre',1,1],['Leucocitosis',1,2],['Neutrofilia',1,1],['Ictericia intensa',0,0],['Dolor que mejora tras la comida',0,0]]},
{id:'duke',name:'Duke modificado',topic:'Cardiología',icon:'❤️',note:'Endocarditis infecciosa: distingue datos diagnósticos mayores y menores.',items:[['Hemocultivos típicos persistentes',1],['Ecocardiograma con vegetación',1],['Nueva insuficiencia valvular',1],['Fenómeno vascular',1],['Fenómeno inmunológico',1],['Fiebre >38 °C',1],['Hipercalcemia',0],['Esputo purulento',0],['Rash malar fotosensible',0],['Pancitopenia grave',0]]},
{id:'jones',name:'Jones',topic:'Pediatría',icon:'🦴',note:'Fiebre reumática aguda: atrapa mayores y menores.',items:[['Carditis',1],['Poliartritis migratoria',1],['Corea de Sydenham',1],['Eritema marginado',1],['Nódulos subcutáneos',1],['Fiebre',1],['VSG/PCR elevadas',1],['Prolongación del PR',1],['Conjuntivitis purulenta',0],['Artritis séptica monoarticular',0]]},
{id:'kawasaki',name:'Kawasaki',topic:'Pediatría',icon:'👶',note:'Vasculitis pediátrica: fiebre prolongada y criterios clínicos.',items:[['Fiebre ≥5 días',1],['Conjuntivitis bilateral no purulenta',1],['Cambios orales',1],['Exantema polimorfo',1],['Cambios en extremidades',1],['Adenopatía cervical',1],['Exudado amigdalar purulento',0],['Vesículas orales dolorosas',0],['Tos productiva persistente',0],['Petequias aisladas',0]]},
{id:'rotterdam',name:'Rotterdam',topic:'Ginecología',icon:'⚖️',note:'SOP: selecciona elementos de 2 de 3 tras excluir otras causas.',items:[['Oligo/anovulación',1],['Hiperandrogenismo clínico o bioquímico',1],['Ovario poliquístico en ecografía',1],['Exclusión de otras causas',1],['Amenorrea primaria obligatoria',0],['Prolactina elevada como criterio',0],['FSH alta persistente',0],['Embarazo ectópico previo',0],['Dolor pélvico cíclico intenso',0],['TSH baja obligatoria',0]]},
{id:'ipi-elena',name:'IPI del linfoma · ELENA + P',topic:'Hematología',icon:'🎗️',note:'Factores pronósticos de los linfomas: recuerda el patrón ELENA y el performance status.',items:[['E · Edad >60 años',1],['L · LDH elevada',1],['E · Estadio de Ann Arbor III–IV',1],['N · Número de áreas extraganglionares ≥2',1],['A · Afectación del estado general',1],['P · Performance status ≥2',1],['Edad <40 años',0],['LDH por debajo del límite normal',0],['Estadio de Ann Arbor I',0],['Afectación de una sola área extraganglionar',0]]}
];
let criteria=[...base],selected=null,deck=[],index=0,points=0,streak=0,answers=[],locked=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function item(x){return Array.isArray(x)?{text:x[0],belongs:!!x[1],value:Number(x[2]||0)}:{text:x.text,belongs:!!x.belongs,value:Number(x.value||0)}}function cards(){return `<section class="hero"><div class="eyebrow">Clasificaciones y criterios MIR</div><h1>Decide rápido. Aprende el patrón.</h1><p class="muted">Acepta los hallazgos que pertenecen al criterio y rechaza distractores. Al final revisa toda la partida, con valores clínicos cuando la escala puntúa.</p></section><section class="deck">${criteria.map(c=>`<button class="module" data-id="${esc(c.id)}"><span class="ico">${esc(c.icon||'✚')}</span><b>${esc(c.name)}</b><small>${esc(c.topic||'General')} · ${c.scoring?'con puntuación':'criterios clínicos'}</small></button>`).join('')}</section>`}function home(){selected=null;$('#report').hidden=true;$('#app').innerHTML=cards();document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>intro(b.dataset.id))}function intro(id){selected=criteria.find(c=>c.id===id);if(!selected)return;const s=selected.scoring;$('#app').innerHTML=`<section class="board result"><div class="eyebrow">${esc(selected.topic||'Criterios clínicos')}</div><h1>${esc(selected.name)}</h1><p class="muted">${esc(selected.note||'')}</p>${s?`<div class="score-note"><b>Escala ${esc(s.range||'')}</b><br><span class="muted">${esc(s.interpretation||'La interpretación se muestra al final.')}</span></div>`:''}<div class="result-actions"><button class="btn primary" id="start">Iniciar ronda</button></div></section>`;$('#start').onclick=start}function start(){deck=(selected.items||[]).map(item).sort(()=>Math.random()-.5).slice(0,10);index=0;points=0;streak=0;answers=[];locked=false;draw()}function draw(){if(index>=deck.length)return finish();const d=deck[index];$('#report').hidden=false;$('#app').innerHTML=`<section class="board"><div class="game-actions"><div class="eyebrow">${esc(selected.name)}</div><span class="muted">Tarjeta ${index+1}/${deck.length}</span></div><div class="hud"><div class="stat"><small>Puntos</small><b>${points}</b></div><div class="stat"><small>Racha</small><b>${streak}</b></div><div class="stat"><small>Modo</small><b>Atrapa</b></div></div><div class="progress"><i style="width:${index/deck.length*100}%"></i></div><div class="fact">${esc(d.text)}</div><p class="question">¿Pertenece a <b>${esc(selected.name)}</b>?</p><div class="choices"><button class="btn choice accept" data-answer="1">✓ Aceptar</button><button class="btn choice reject" data-answer="0">× Rechazar</button></div><div class="feedback" id="feedback"></div></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)))}function answer(v){if(locked)return;locked=true;const d=deck[index],ok=d.belongs===!!v;answers.push({...d,chosen:!!v,ok});const f=$('#feedback');if(ok){points+=10+streak*2;streak++;f.className='feedback ok';f.textContent=d.belongs&&selected.scoring?`¡Correcto! Valor: ${d.value>0?'+':''}${d.value} punto(s).`:'¡Correcto!'}else{streak=0;f.className='feedback no';f.textContent=d.belongs?'Era un componente del criterio.':'Era un distractor.'}document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);setTimeout(()=>{index++;locked=false;draw()},700)}function finish(){const pct=Math.round(points/190*100),total=answers.filter(a=>a.belongs).reduce((n,a)=>n+a.value,0);$('#report').hidden=true;$('#app').innerHTML=`<section class="board result"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><h1>${pct>=75?'Racha clínica activada':'Ronda completada'}</h1><p class="muted">${points} puntos arcade. ${selected.scoring?`Puntuación correcta de esta ronda: <b>${total} / ${esc(selected.scoring.range||'')}</b>.`:''}</p>${selected.scoring?`<div class="score-note">${esc(selected.scoring.interpretation||'')}</div>`:''}<h3>Revisión completa</h3><div class="review">${answers.map(a=>`<div class="review-row"><b class="${a.ok?'ok':'no'}">${a.ok?'✓':'×'}</b><span><b>${esc(a.text)}</b><br><small>${a.belongs?'Pertenece al criterio':'Distractor'}${a.chosen?' · Aceptaste':' · Rechazaste'}</small></span><b>${a.belongs&&selected.scoring?`${a.value>0?'+':''}${a.value} pt`:''}</b></div>`).join('')}</div><div class="result-actions"><button class="btn" id="back">Otra clasificación</button><button class="btn primary" id="again">Repetir</button></div></section>`;$('#back').onclick=home;$('#again').onclick=start}function report(){if(!selected||index>=deck.length)return;const d=deck[index];parent.postMessage({type:'nexmir:criteria-rush-report',sourceId:`criteria-rush:${selected.id}:${index}`,title:selected.name,prompt:d.text},location.origin)}
$('#exit').onclick=()=>parent.postMessage({type:'nexmir:arcade-exit'},location.origin);$('#suggest').onclick=()=>parent.postMessage({type:'nexmir:arcade-suggest'},location.origin);$('#report').onclick=report;window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==='nexmir:arcade-criteria-init'){const customs=Array.isArray(d.criteria)?d.criteria:[];criteria=[...base,...customs.map(c=>({...c,items:c.items||[]}))];home()}});parent.postMessage({type:'nexmir:arcade-ready'},location.origin);
</script><script>
/* V5.1.42 · selector común de especialidad y modo mix */
let rushScope='all';
const rushSpecialty=c=>c.specialty||({centor:'ORL',alvarado:'Cirugía General',duke:'Cardiología',jones:'Pediatría',kawasaki:'Pediatría',rotterdam:'Ginecología','ipi-elena':'Hematología'}[c.id]||c.topic||'Miscelánea');
function rushHome(){selected=null;$('#report').hidden=true;const specialties=[...new Set(criteria.map(rushSpecialty))].sort((a,b)=>a.localeCompare(b,'es'));const visible=criteria.filter(c=>rushScope==='all'||rushSpecialty(c)===rushScope);$('#app').innerHTML=`<section class="hero"><div class="eyebrow">Clasificaciones y criterios MIR</div><h1>Decide rápido. Aprende el patrón.</h1><p class="muted">Elige una especialidad o usa Mix para alternar criterios de todo NEXMIR.</p><div class="result-actions"><select class="btn" id="rushScope"><option value="all">✦ Mix de todas las especialidades</option>${specialties.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}</select><button class="btn primary" id="rushRandom">Jugar criterio aleatorio</button></div></section><section class="deck">${visible.map(c=>`<button class="module" data-id="${esc(c.id)}"><span class="ico">${esc(c.icon||'✚')}</span><b>${esc(c.name)}</b><small>${esc(rushSpecialty(c))} · ${esc(c.topic||'General')}</small></button>`).join('')||'<p class="muted">No hay criterios en esta especialidad.</p>'}</section>`;$('#rushScope').value=rushScope;$('#rushScope').onchange=e=>{rushScope=e.target.value;rushHome()};$('#rushRandom').onclick=()=>{const pool=criteria.filter(c=>rushScope==='all'||rushSpecialty(c)===rushScope);if(pool.length)intro(pool[Math.floor(Math.random()*pool.length)].id)};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>intro(b.dataset.id))}
home=rushHome;rushHome();
</script></body></html>
